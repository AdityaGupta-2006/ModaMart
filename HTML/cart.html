<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Moda Mart</title>
    <link rel="stylesheet" href="../CSS/cart.css">
</head>
<body>

    <div class="cart-container">

        <h1>Shopping Cart</h1>

        <div class="cart-wrapper">

            <div class="cart-items">

                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1607345366928-199ea26cfe3e?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product">
                    <div class="item-details">
                        <h2>Men's Casual Shirt</h2>
                        <p class="seller">Sold by Moda Mart Official</p>
                        <p class="price">₹ 799</p>

                        <div class="qty-box">
                            <label>Qty:</label>
                            <select>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                            </select>
                        </div>

                        <button class="remove-btn">Remove</button>
                    </div>
                </div>

                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1543508282-6319a3e2621f?q=80&w=1015&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product">
                    <div class="item-details">
                        <h2>Running Shoes</h2>
                        <p class="seller">Sold by Moda Mart Footwear</p>
                        <p class="price">₹ 1,499</p>

                        <div class="qty-box">
                            <label>Qty:</label>
                            <select>
                                <option>1</option>
                                <option>2</option>
                            </select>
                        </div>

                        <button class="remove-btn">Remove</button>
                    </div>
                </div>

            </div>

            
            <div class="summary-box">
                <h3>Price Details</h3>

                <div class="price-row">
                    <span>Total MRP</span> <span>₹ 2,298</span>
                </div>

                <div class="price-row">
                    <span>Discount</span> <span class="green">− ₹ 300</span>
                </div>

                <div class="price-row">
                    <span>Delivery Charges</span> <span class="green">FREE</span>
                </div>

                <hr>

                <div class="price-row total">
                    <span>Total Amount</span> <span>₹ 1,998</span>
                </div>

                <button class="place-order-btn">Place Order</button>
            </div>

        </div>
        <button id="btn">Dark Mode</button>
    </div>
<script src="../JAVA SCRIPT/cart.js"></script>

</body>
</html>
