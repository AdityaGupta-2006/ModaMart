<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Moda Mart</title>
    <link rel="stylesheet" href="wishlist.css">
</head>
<body>

    <div class="wishlist-container">
        <h1>My Wishlist ❤️</h1>

        <div class="wishlist-grid">

            
            <div class="wish-card">
                <img src="https://images.unsplash.com/photo-1695300576133-f97b57e599c3?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product">
                <h2>Casual Shirt</h2>
                <p class="brand">Moda Mart</p>
                <p class="price">₹ 799</p>

                <div class="btn-group">
                    <button class="remove-btn">Remove</button>
                    <button class="cart-btn">Move to Cart</button>
                </div>
            </div>

            
            <div class="wish-card">
                <img src="https://images.unsplash.com/photo-1709258228137-19a8c193be39?q=80&w=1111&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product">
                <h2>Running Shoes</h2>
                <p class="brand">Moda Mart Footwear</p>
                <p class="price">₹ 1,499</p>

                <div class="btn-group">
                    <button class="remove-btn">Remove</button>
                    <button class="cart-btn">Move to Cart</button>
                </div>
            </div>

            
            <div class="wish-card">
                <img src="https://images.unsplash.com/photo-1695345272166-4efd76dd7a21?q=80&w=1035&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product">
                <h2>Analog Wrist Watch</h2>
                <p class="brand">Moda Mart Premium</p>
                <p class="price">₹ 1,299</p>

                <div class="btn-group">
                    <button class="remove-btn">Remove</button>
                    <button class="cart-btn">Move to Cart</button>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
