<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modamart | Sign In / Sign Up</title>
  <link rel="icon" type="image/png" href="modamart-logo.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff7fa, #ffe4ee);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      width: 90%;
      max-width: 1100px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    
    .left {
      flex: 1;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px;
    }

    .left img {
      width: 300px;
      height: 130px;
      max-width: 90%;
      box-sizing: border-box;
      padding-bottom: 15px;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.15));
    }

    
    .right {
      flex: 1;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #fff;
    }

    img {
        width: 400px;
    }

    h2 {
      font-size: 2rem;
      font-weight: 600;
      color: #222;
      text-align: center;
      margin-bottom: 8px;
    }

    p.subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    label {
      font-size: 0.9rem;
      color: #444;
    }

    input {
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #d81b60;
      box-shadow: 0 0 6px #d81b6033;
    }

    button {
      background:#d81b60;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      font-size: 1rem;
      transition: 0.3s;
    }


    .toggle-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #555;
    }

    .toggle-text span {
      color: #d81b60;
      cursor: pointer;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left {
        padding:30px 10px 30px 10px;
        
        box-sizing: border-box;
      }
      .left img {
        width: 350px;
        height: 115px;
        padding:0px
      }
    }
  </style>
</head>

<body>
  <div class="container">
   
    <div class="left">
      <img src="modamart-logo.png" alt="Modamart Logo" />
    </div>

    
    <div class="right">
      
      <div id="signin-section">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to continue your style journey</p>
        <form>
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required />
          <label>Password</label>
          <input type="password" placeholder="••••••••" required />
          <button type="submit">Sign In</button>
        </form>
        <p class="toggle-text">
          Don’t have an account?
          <span onclick="showSignup()">Create one</span>
        </p>
      </div>

      
      <div id="signup-section" style="display: none;">
        <h2>Join Modamart</h2>
        <p class="subtitle">Create your account to explore the latest styles</p>
        <form>
          <label>Full Name</label>
          <input type="text" placeholder="Your name" required />
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required />
          <label>Password</label>
          <input type="password" placeholder="••••••••" required />
          <button type="submit">Sign Up</button>
        </form>
        <p class="toggle-text">
          Already have an account?
          <span onclick="showSignin()">Sign In</span>
        </p>
      </div>
    </div>
  </div>

  <script>
    const signin = document.getElementById("signin-section");
    const signup = document.getElementById("signup-section");

    function showSignup() {
      signin.style.display = "none";
      signup.style.display = "block";
    }

    function showSignin() {
      signup.style.display = "none";
      signin.style.display = "block";
    }
  </script>
</body>
</html>
